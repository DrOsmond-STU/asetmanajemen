<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer blue circle with text -->
  <defs>
    <path id="circularPath" d="M 100,100 m -80,0 a 80,80 0 0,1 160,0 a 80,80 0 0,1 -160,0" fill="none"/>
    <path id="circularPathTop" d="M 20,100 A 80,80 0 0,1 180,100" fill="none"/>
    <path id="circularPathBottom" d="M 180,100 A 80,80 0 0,1 20,100" fill="none"/>
  </defs>

  <!-- Outer blue circle background -->
  <circle cx="100" cy="100" r="95" fill="#1E5BA8" stroke="#0D3B7A" stroke-width="2"/>

  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="75" fill="#FFFFFF" stroke="#1E5BA8" stroke-width="1.5"/>

  <!-- Top text curved -->
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D3B7A" letter-spacing="2">
    <textPath href="#circularPathTop" startOffset="50%" text-anchor="middle">
      LEMBAGA PUSAT KAJIAN MANAJEMEN
    </textPath>
  </text>

  <!-- Bottom text curved -->
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D3B7A" letter-spacing="2">
    <textPath href="#circularPathBottom" startOffset="50%" text-anchor="middle">
      INDONESIA
    </textPath>
  </text>

  <!-- Center design: Open book -->
  <path d="M 80 60 L 100 70 L 120 60 L 120 95 Q 100 105 80 95 Z" fill="none" stroke="#1E5BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="70" x2="100" y2="100" stroke="#1E5BA8" stroke-width="1.5"/>
  <path d="M 85 75 Q 92 80 100 82" fill="none" stroke="#1E5BA8" stroke-width="1"/>
  <path d="M 115 75 Q 108 80 100 82" fill="none" stroke="#1E5BA8" stroke-width="1"/>

  <!-- Left branch (laurel/leaves) - Yellow -->
  <path d="M 70 100 Q 65 105 68 115 Q 72 112 75 118 Q 78 110 80 118 Q 82 108 85 115 Q 86 105 80 100" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>

  <!-- Right branch (leaves) - Green -->
  <path d="M 130 100 Q 135 105 132 115 Q 128 112 125 118 Q 122 110 120 118 Q 118 108 115 115 Q 114 105 120 100" fill="#22C55E" stroke="#16A34A" stroke-width="0.5"/>

  <!-- LPKMI text in center -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0D3B7A" text-anchor="middle">LPKMI</text>

  <!-- Decorative stars -->
  <g fill="#1E5BA8">
    <!-- Star 1 - Top left -->
    <path d="M 45 95 L 47 101 L 53 101 L 48 105 L 50 111 L 45 107 L 40 111 L 42 105 L 37 101 L 43 101 Z"/>
    <!-- Star 2 - Top right -->
    <path d="M 155 95 L 157 101 L 163 101 L 158 105 L 160 111 L 155 107 L 150 111 L 152 105 L 147 101 L 153 101 Z"/>
  </g>
</svg>